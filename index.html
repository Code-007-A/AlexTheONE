<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ALEX — The ONE</title>


<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #000;
}

body {

    background: #000;

    color: #00ff41;

    font-family:
        "Courier New",
        monospace;

    /*
        Increase this number if you want
        more scrolling distance.
    */

    height: 1000vh;

    overflow-x: hidden;
}


/* =========================================================
   MATRIX CANVAS
========================================================= */

#matrix {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;

    background: #000;
}


/* =========================================================
   DARK OVERLAY
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:

        radial-gradient(
            circle at center,

            rgba(0,255,65,.06),

            rgba(0,0,0,.72)
        );
}


/* =========================================================
   ALEX
========================================================= */

#name {

    position: fixed;

    z-index: 5;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.75);

    width: 100%;

    text-align: center;

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(
            70px,
            17vw,
            250px
        );

    font-weight: bold;

    letter-spacing: .10em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 35px #00ff41,

        0 0 70px rgba(0,255,65,.7);

    opacity: 0;

    white-space: nowrap;

    transition:

        opacity .12s linear,

        transform .12s linear;
}


/* =========================================================
   ANNIVERSARY MESSAGE
========================================================= */

#message {

    position: fixed;

    z-index: 6;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.90);

    width: 90%;

    text-align: center;

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(
            24px,
            4.5vw,
            72px
        );

    font-weight: bold;

    line-height: 1.35;

    letter-spacing: .04em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 30px #00ff41,

        0 0 60px rgba(0,255,65,.7);

    opacity: 0;

    white-space: normal;

    pointer-events: none;

    transition:

        opacity .15s linear,

        transform .15s linear;
}


/* =========================================================
   FINAL CREDIT
========================================================= */

#credit {

    position: fixed;

    z-index: 7;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.80);

    width: 90%;

    text-align: center;

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(
            18px,
            3.2vw,
            48px
        );

    font-weight: normal;

    line-height: 1.4;

    letter-spacing: .08em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 30px #00ff41,

        0 0 60px rgba(0,255,65,.7);

    opacity: 0;

    white-space: nowrap;

    pointer-events: none;

    transition:

        opacity .12s linear,

        transform .12s linear;
}


/* =========================================================
   GLITCH EFFECT
========================================================= */

.glitch {

    animation:
        glitch .12s infinite;
}


@keyframes glitch {

    0% {

        transform:
            translate(-50%, -50%)
            translate(0,0)
            scale(1);
    }

    20% {

        transform:
            translate(-50%, -50%)
            translate(-4px,2px)
            scale(1.01);
    }

    40% {

        transform:
            translate(-50%, -50%)
            translate(4px,-2px)
            scale(.99);
    }

    60% {

        transform:
            translate(-50%, -50%)
            translate(-2px,-1px)
            scale(1.01);
    }

    80% {

        transform:
            translate(-50%, -50%)
            translate(3px,2px)
            scale(.99);
    }

    100% {

        transform:
            translate(-50%, -50%)
            translate(0,0)
            scale(1);
    }
}


/* =========================================================
   SCROLL INSTRUCTION
========================================================= */

#instruction {

    position: fixed;

    z-index: 7;

    left: 50%;

    bottom: 8%;

    transform:
        translateX(-50%);

    color:
        rgba(0,255,65,.85);

    font-size: 14px;

    letter-spacing: 4px;

    text-align: center;

    text-shadow:
        0 0 10px #00ff41;

    transition:
        opacity .5s ease;

    white-space: nowrap;
}


/* =========================================================
   SCANLINES
========================================================= */

.scanlines {

    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    background:

        repeating-linear-gradient(

            to bottom,

            rgba(255,255,255,.025)
            0px,

            rgba(255,255,255,.025)
            1px,

            transparent
            2px,

            transparent
            4px
        );

    mix-blend-mode: screen;
}


/* =========================================================
   SCREEN GLOW
========================================================= */

.screenGlow {

    position: fixed;

    inset: 0;

    z-index: 9;

    pointer-events: none;

    box-shadow:

        inset
        0 0 100px
        rgba(0,255,65,.12);
}


/* =========================================================
   BOTTOM FLASH
========================================================= */

#flash {

    position: fixed;

    inset: 0;

    z-index: 11;

    background: #00ff41;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .1s linear;
}

</style>

</head>


<body>


<!-- =====================================================
     MATRIX BACKGROUND
===================================================== -->

<canvas id="matrix"></canvas>

<div class="overlay"></div>


<!-- =====================================================
     ALEX
===================================================== -->

<div id="name">
    ALEX
</div>


<!-- =====================================================
     ANNIVERSARY MESSAGE
===================================================== -->

<div id="message">
    You're the ONE;<br>
    Happy Work-Anniversary!
</div>


<!-- =====================================================
     FINAL CREDIT
===================================================== -->

<div id="credit">
    In Courtesy of Land/FX
</div>


<!-- =====================================================
     INSTRUCTION
===================================================== -->

<div id="instruction">
    SCROLL TO DECODE
</div>


<!-- =====================================================
     EFFECTS
===================================================== -->

<div id="flash"></div>

<div class="scanlines"></div>

<div class="screenGlow"></div>



<script>

/* =========================================================
   MATRIX ENGINE
========================================================= */

const canvas =
    document.getElementById("matrix");

const ctx =
    canvas.getContext("2d");


let width;
let height;

let fontSize = 18;

let columns;

let drops = [];


/*
    Matrix character set
*/

const matrixCharacters =

"アァカサタナハマヤラワ0123456789" +

"ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

"#$%&*@";


/* =========================================================
   RESIZE CANVAS
========================================================= */

function resizeCanvas() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;


    columns =
        Math.floor(
            width / fontSize
        );


    drops = [];


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        drops[i] =
            Math.random() * -50;
    }
}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   MATRIX RAIN
========================================================= */

function drawMatrix() {


    /*
        Transparent black creates
        the trailing effect.
    */

    ctx.fillStyle =
        "rgba(0,0,0,0.075)";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.font =
        fontSize +
        "px Courier New";


    for (
        let i = 0;
        i < drops.length;
        i++
    ) {


        const character =

            matrixCharacters[
                Math.floor(
                    Math.random() *
                    matrixCharacters.length
                )
            ];


        /*
            Random brightness
        */

        const brightness =
            Math.random();


        if (
            brightness > .94
        ) {

            ctx.fillStyle =
                "#ffffff";

        }

        else if (
            brightness > .75
        ) {

            ctx.fillStyle =
                "#66ff88";

        }

        else {

            ctx.fillStyle =
                "#00ff41";
        }


        ctx.fillText(

            character,

            i * fontSize,

            drops[i] *
            fontSize
        );


        /*
            Restart streams
        */

        if (

            drops[i] *
            fontSize >
            height

            &&

            Math.random() > .975

        ) {

            drops[i] = 0;
        }


        drops[i] += .45;
    }


    requestAnimationFrame(
        drawMatrix
    );
}


drawMatrix();



/* =========================================================
   ELEMENTS
========================================================= */

const name =
    document.getElementById("name");

const message =
    document.getElementById("message");

const credit =
    document.getElementById("credit");

const instruction =
    document.getElementById(
        "instruction"
    );

const flash =
    document.getElementById("flash");



/* =========================================================
   SCRAMBLE CHARACTERS
========================================================= */

const glitchCharacters =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

"0123456789" +

"@#$%&*<>[]{}" +

"アカサタナハマヤラ";


/* =========================================================
   GENERATE SCRAMBLED TEXT
========================================================= */

function scrambleText(
    target,
    progress
) {

    let output = "";


    for (
        let i = 0;
        i < target.length;
        i++
    ) {


        /*
            Spaces remain spaces.
        */

        if (
            target[i] === " "
            ||
            target[i] === "\n"
            ||
            target[i] === "-"
            ||
            target[i] === ";"
        ) {

            output +=
                target[i];

            continue;
        }


        /*
            Each character gets
            its own decoding point.
        */

        const characterProgress =

            progress *
            target.length
            -
            i;


        if (
            characterProgress >= 1
        ) {

            output +=
                target[i];

        }

        else {

            output +=

                glitchCharacters[
                    Math.floor(
                        Math.random() *
                        glitchCharacters.length
                    )
                ];
        }
    }


    return output;
}



/* =========================================================
   HTML SCRAMBLE
========================================================= */

function scrambleTextHTML(
    target,
    progress
) {

    let output = "";


    for (
        let i = 0;
        i < target.length;
        i++
    ) {

        const character =
            target[i];


        /*
            Preserve line breaks.
        */

        if (
            character === "\n"
        ) {

            output +=
                "<br>";

            continue;
        }


        /*
            Preserve spaces.
        */

        if (
            character === " "
        ) {

            output +=
                "&nbsp;";

            continue;
        }


        /*
            Preserve punctuation.
        */

        if (
            character === "-" ||
            character === "!" ||
            character === ";"
        ) {

            output +=
                character;

            continue;
        }


        /*
            Decode character
            progressively.
        */

        const characterProgress =

            progress *
            target.length
            -
            i;


        if (
            characterProgress >= 1
        ) {

            output +=
                character;

        }

        else {

            output +=

                glitchCharacters[
                    Math.floor(
                        Math.random() *
                        glitchCharacters.length
                    )
                ];
        }
    }


    return output;
}



/* =========================================================
   SCROLL
========================================================= */

window.addEventListener(
    "scroll",
    updateScroll,
    { passive: true }
);


function updateScroll() {


    /*
        Calculate total scroll.
    */

    const maxScroll =

        document.documentElement
        .scrollHeight
        -
        window.innerHeight;


    let scrollProgress =

        window.scrollY /
        maxScroll;


    /*
        Keep between 0 and 1.
    */

    scrollProgress =

        Math.max(
            0,
            Math.min(
                1,
                scrollProgress
            )
        );



    /* =====================================================
       STAGE 1
       MATRIX ONLY
       0% → 8%
    ===================================================== */

    if (
        scrollProgress < .08
    ) {

        name.style.opacity = 0;

        message.style.opacity = 0;

        credit.style.opacity = 0;
    }



    /* =====================================================
       STAGE 2
       ALEX DECODING
       8% → 38%
    ===================================================== */

    if (
        scrollProgress >= .08 &&
        scrollProgress < .38
    ) {

        const alexProgress =

            (scrollProgress - .08) /
            .30;


        name.style.opacity =
            alexProgress;


        const alexScale =

            .75 +
            alexProgress * .25;


        name.style.transform =

            `translate(-50%, -50%)
             scale(${alexScale})`;


        name.textContent =

            scrambleText(
                "ALEX",
                alexProgress
            );


        name.classList.add(
            "glitch"
        );


        message.style.opacity = 0;

        credit.style.opacity = 0;
    }



    /* =====================================================
       STAGE 3
       ALEX HOLD
       38% → 65%
    ===================================================== */

    if (
        scrollProgress >= .38 &&
        scrollProgress < .65
    ) {

        name.style.opacity = 1;

        name.style.transform =

            "translate(-50%, -50%) scale(1)";

        name.textContent =
            "ALEX";

        name.classList.remove(
            "glitch"
        );


        message.style.opacity = 0;

        credit.style.opacity = 0;
    }



    /* =====================================================
       STAGE 4
       ALEX FADES OUT
       65% → 72%
    ===================================================== */

    if (
        scrollProgress >= .65 &&
        scrollProgress < .72
    ) {

        const fadeOut =

            1 -
            (
                (scrollProgress - .65) /
                .07
            );


        name.style.opacity =
            Math.max(
                0,
                fadeOut
            );


        name.classList.remove(
            "glitch"
        );


        message.style.opacity = 0;

        credit.style.opacity = 0;
    }



    /* =====================================================
       STAGE 5
       ANNIVERSARY MESSAGE DECODING
       72% → 91%
    ===================================================== */

    if (
        scrollProgress >= .72 &&
        scrollProgress < .91
    ) {

        const messageProgress =

            (scrollProgress - .72) /
            .19;


        name.style.opacity = 0;


        message.style.opacity =
            messageProgress;


        const messageScale =

            .90 +
            messageProgress * .10;


        message.style.transform =

            `translate(-50%, -50%)
             scale(${messageScale})`;


        message.innerHTML =

            scrambleTextHTML(

                "You're the ONE;\n" +
                "Happy Work-Anniversary!",

                messageProgress
            );


        message.classList.add(
            "glitch"
        );


        credit.style.opacity = 0;
    }



    /* =====================================================
       STAGE 6
       ANNIVERSARY MESSAGE HOLD
       91% → 94%
    ===================================================== */

    if (
        scrollProgress >= .91 &&
        scrollProgress < .94
    ) {

        name.style.opacity = 0;

        message.style.opacity = 1;

        message.style.transform =

            "translate(-50%, -50%) scale(1)";

        message.innerHTML =

            "You're the ONE;<br>" +
            "Happy Work-Anniversary!";


        message.classList.remove(
            "glitch"
        );


        credit.style.opacity = 0;
    }



    /* =====================================================
       STAGE 7
       ANNIVERSARY FADES OUT
       94% → 95%
    ===================================================== */

    if (
        scrollProgress >= .94 &&
        scrollProgress < .95
    ) {

        const fadeOut =

            1 -
            (
                (scrollProgress - .94) /
                .01
            );


        name.style.opacity = 0;

        message.style.opacity =
            Math.max(
                0,
                fadeOut
            );

        credit.style.opacity = 0;
    }



    /* =====================================================
       STAGE 8
       FINAL CREDIT DECODING
       95% → 100%
    ===================================================== */

    if (
        scrollProgress >= .95
    ) {

        name.style.opacity = 0;

        message.style.opacity = 0;


        /*
            Convert the final 5%
            into a 0 → 1 value.
        */

        const creditProgress =

            (scrollProgress - .95) /
            .05;


        /*
            Fade / scale credit in.
        */

        credit.style.opacity = 1;


        const creditScale =

            .80 +
            creditProgress * .20;


        credit.style.transform =

            `translate(-50%, -50%)
             scale(${creditScale})`;


        /*
            Matrix decoding effect.
        */

        credit.textContent =

            scrambleText(

                "In Courtesy of Land/FX",

                creditProgress
            );


        /*
            Keep glitching while
            the characters decode.
        */

        if (
            creditProgress < 1
        ) {

            credit.classList.add(
                "glitch"
            );

        }

        else {

            credit.classList.remove(
                "glitch"
            );


            credit.textContent =
                "In Courtesy of Land/FX";
        }
    }



    /* =====================================================
       INSTRUCTION
    ===================================================== */

    if (
        scrollProgress < .08
    ) {

        instruction.style.opacity = 1;

    }

    else {

        instruction.style.opacity =

            Math.max(
                0,
                1 -
                scrollProgress * 4
            );
    }



    /* =====================================================
       FINAL FLASH
    ===================================================== */

    if (
        scrollProgress > .985
    ) {

        const flashAmount =

            (
                scrollProgress - .985
            ) * 6;


        flash.style.opacity =

            Math.min(
                .06,
                flashAmount
            );

    }

    else {

        flash.style.opacity = 0;
    }

}



/* =========================================================
   INITIAL STATE
========================================================= */

updateScroll();

</script>

</body>

</html>
