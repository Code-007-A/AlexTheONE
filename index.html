<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ALEX — The ONE</title>


<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #000;
}

body {

    background: #000;

    color: #00ff41;

    font-family:
        "Courier New",
        monospace;

    height: 1000vh;

    overflow-x: hidden;
}


/* =========================================================
   MATRIX CANVAS
========================================================= */

#matrix {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;

    background: #000;
}


/* =========================================================
   DARK OVERLAY
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:

        radial-gradient(
            circle at center,

            rgba(0,255,65,.06),

            rgba(0,0,0,.72)
        );
}


/* =========================================================
   ALEX
========================================================= */

#name {

    position: fixed;

    z-index: 5;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.75);

    width: 100%;

    text-align: center;

    font-size:
        clamp(
            70px,
            17vw,
            250px
        );

    font-weight: bold;

    letter-spacing: .10em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 35px #00ff41,

        0 0 70px rgba(0,255,65,.7);

    opacity: 0;

    white-space: nowrap;
}


/* =========================================================
   ANNIVERSARY MESSAGE
========================================================= */

#message {

    position: fixed;

    z-index: 6;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.90);

    width: 90%;

    text-align: center;

    font-size:
        clamp(
            24px,
            4.5vw,
            72px
        );

    font-weight: bold;

    line-height: 1.35;

    letter-spacing: .04em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 30px #00ff41,

        0 0 60px rgba(0,255,65,.7);

    opacity: 0;

    pointer-events: none;
}


/* =========================================================
   FINAL CREDIT
========================================================= */

#credit {

    position: fixed;

    z-index: 7;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.75);

    width: 95%;

    text-align: center;

    font-size:
        clamp(
            18px,
            3.2vw,
            48px
        );

    font-weight: normal;

    line-height: 1.4;

    letter-spacing: .08em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 30px #00ff41,

        0 0 60px rgba(0,255,65,.7);

    opacity: 0;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   GLITCH
========================================================= */

.glitch {

    animation:
        glitch .12s infinite;
}


@keyframes glitch {

    0% {

        filter:
            brightness(1);
    }

    25% {

        filter:
            brightness(1.8);
    }

    50% {

        filter:
            brightness(.7);
    }

    75% {

        filter:
            brightness(1.5);
    }

    100% {

        filter:
            brightness(1);
    }
}


/* =========================================================
   SCROLL INSTRUCTION
========================================================= */

#instruction {

    position: fixed;

    z-index: 7;

    left: 50%;

    bottom: 8%;

    transform:
        translateX(-50%);

    color:
        rgba(0,255,65,.85);

    font-size: 14px;

    letter-spacing: 4px;

    text-align: center;

    text-shadow:
        0 0 10px #00ff41;

    transition:
        opacity .5s ease;

    white-space: nowrap;
}


/* =========================================================
   SCANLINES
========================================================= */

.scanlines {

    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    background:

        repeating-linear-gradient(

            to bottom,

            rgba(255,255,255,.025)
            0px,

            rgba(255,255,255,.025)
            1px,

            transparent
            2px,

            transparent
            4px
        );

    mix-blend-mode: screen;
}


/* =========================================================
   SCREEN GLOW
========================================================= */

.screenGlow {

    position: fixed;

    inset: 0;

    z-index: 9;

    pointer-events: none;

    box-shadow:

        inset
        0 0 100px
        rgba(0,255,65,.12);
}


/* =========================================================
   FLASH
========================================================= */

#flash {

    position: fixed;

    inset: 0;

    z-index: 11;

    background: #00ff41;

    opacity: 0;

    pointer-events: none;
}

</style>

</head>


<body>


<!-- =====================================================
     MATRIX
===================================================== -->

<canvas id="matrix"></canvas>

<div class="overlay"></div>


<!-- =====================================================
     ALEX
===================================================== -->

<div id="name">
    ALEX
</div>


<!-- =====================================================
     ANNIVERSARY MESSAGE
===================================================== -->

<div id="message">
    You're the ONE;<br>
    Happy Work-Anniversary!
</div>


<!-- =====================================================
     FINAL CREDIT
===================================================== -->

<div id="credit">
    In Courtesy of Land/FX
</div>


<!-- =====================================================
     INSTRUCTION
===================================================== -->

<div id="instruction">
    SCROLL TO DECODE
</div>


<div id="flash"></div>

<div class="scanlines"></div>

<div class="screenGlow"></div>



<script>

/* =========================================================
   MATRIX ENGINE
========================================================= */

const canvas =
    document.getElementById("matrix");

const ctx =
    canvas.getContext("2d");


let width;
let height;

let fontSize = 18;

let columns;

let drops = [];


const matrixCharacters =

"アァカサタナハマヤラワ0123456789" +

"ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

"#$%&*@";


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;


    columns =
        Math.floor(
            width / fontSize
        );


    drops = [];


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        drops[i] =
            Math.random() * -50;
    }
}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   MATRIX RAIN
========================================================= */

function drawMatrix() {

    ctx.fillStyle =
        "rgba(0,0,0,0.075)";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.font =
        fontSize +
        "px Courier New";


    for (
        let i = 0;
        i < drops.length;
        i++
    ) {

        const character =

            matrixCharacters[
                Math.floor(
                    Math.random() *
                    matrixCharacters.length
                )
            ];


        const brightness =
            Math.random();


        if (
            brightness > .94
        ) {

            ctx.fillStyle =
                "#ffffff";

        }

        else if (
            brightness > .75
        ) {

            ctx.fillStyle =
                "#66ff88";

        }

        else {

            ctx.fillStyle =
                "#00ff41";
        }


        ctx.fillText(

            character,

            i * fontSize,

            drops[i] * fontSize
        );


        if (

            drops[i] * fontSize >
            height

            &&

            Math.random() > .975

        ) {

            drops[i] = 0;
        }


        drops[i] += .45;
    }


    requestAnimationFrame(
        drawMatrix
    );
}


drawMatrix();



/* =========================================================
   ELEMENTS
========================================================= */

const name =
    document.getElementById("name");

const message =
    document.getElementById("message");

const credit =
    document.getElementById("credit");

const instruction =
    document.getElementById(
        "instruction"
    );

const flash =
    document.getElementById("flash");



/* =========================================================
   SCRAMBLE CHARACTERS
========================================================= */

const glitchCharacters =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

"0123456789" +

"@#$%&*<>[]{}" +

"アカサタナハマヤラ";



/* =========================================================
   SCRAMBLE TEXT
========================================================= */

function scrambleText(
    target,
    progress
) {

    let output = "";


    for (
        let i = 0;
        i < target.length;
        i++
    ) {

        const character =
            target[i];


        /*
            Keep spaces and punctuation.
        */

        if (
            character === " " ||
            character === "-" ||
            character === "/" ||
            character === ";"
        ) {

            output += character;

            continue;
        }


        const characterProgress =

            progress *
            target.length
            -
            i;


        if (
            characterProgress >= 1
        ) {

            output += character;

        }

        else {

            output +=

                glitchCharacters[
                    Math.floor(
                        Math.random() *
                        glitchCharacters.length
                    )
                ];
        }
    }


    return output;
}



/* =========================================================
   HTML SCRAMBLE
========================================================= */

function scrambleTextHTML(
    target,
    progress
) {

    let output = "";


    for (
        let i = 0;
        i < target.length;
        i++
    ) {

        const character =
            target[i];


        if (
            character === "\n"
        ) {

            output += "<br>";

            continue;
        }


        if (
            character === " "
        ) {

            output += "&nbsp;";

            continue;
        }


        if (
            character === "-" ||
            character === "!" ||
            character === ";"
        ) {

            output += character;

            continue;
        }


        const characterProgress =

            progress *
            target.length
            -
            i;


        if (
            characterProgress >= 1
        ) {

            output += character;

        }

        else {

            output +=

                glitchCharacters[
                    Math.floor(
                        Math.random() *
                        glitchCharacters.length
                    )
                ];
        }
    }


    return output;
}



/* =========================================================
   SCROLL
========================================================= */

window.addEventListener(
    "scroll",
    updateScroll,
    { passive: true }
);


function updateScroll() {


    const maxScroll =

        document.documentElement
        .scrollHeight
        -
        window.innerHeight;


    let p =

        window.scrollY /
        maxScroll;


    p =

        Math.max(
            0,
            Math.min(
                1,
                p
            )
        );



    /* =====================================================
       0% → 8%
       MATRIX ONLY
    ===================================================== */

    if (
        p < .08
    ) {

        name.style.opacity = 0;

        message.style.opacity = 0;

        credit.style.opacity = 0;
    }



    /* =====================================================
       8% → 38%
       ALEX DECODES
    ===================================================== */

    if (
        p >= .08 &&
        p < .38
    ) {

        const progress =

            (p - .08) /
            .30;


        name.style.opacity =
            progress;


        name.style.transform =

            `translate(-50%, -50%)
             scale(${.75 +
                    progress * .25})`;


        name.textContent =

            scrambleText(
                "ALEX",
                progress
            );


        name.classList.add(
            "glitch"
        );


        message.style.opacity = 0;

        credit.style.opacity = 0;
    }



    /* =====================================================
       38% → 65%
       ALEX HOLDS
    ===================================================== */

    if (
        p >= .38 &&
        p < .65
    ) {

        name.style.opacity = 1;

        name.style.transform =

            "translate(-50%, -50%) scale(1)";

        name.textContent =
            "ALEX";

        name.classList.remove(
            "glitch"
        );


        message.style.opacity = 0;

        credit.style.opacity = 0;
    }



    /* =====================================================
       65% → 72%
       ALEX FADES
    ===================================================== */

    if (
        p >= .65 &&
        p < .72
    ) {

        const fade =

            1 -
            (
                (p - .65) /
                .07
            );


        name.style.opacity =
            Math.max(
                0,
                fade
            );


        name.classList.remove(
            "glitch"
        );


        message.style.opacity = 0;

        credit.style.opacity = 0;
    }



    /* =====================================================
       72% → 88%
       ANNIVERSARY DECODES
    ===================================================== */

    if (
        p >= .72 &&
        p < .88
    ) {

        const progress =

            (p - .72) /
            .16;


        name.style.opacity = 0;


        message.style.opacity =
            progress;


        message.style.transform =

            `translate(-50%, -50%)
             scale(${.90 +
                    progress * .10})`;


        message.innerHTML =

            scrambleTextHTML(

                "You're the ONE;\n" +
                "Happy Work-Anniversary!",

                progress
            );


        message.classList.add(
            "glitch"
        );


        credit.style.opacity = 0;
    }



    /* =====================================================
       88% → 92%
       ANNIVERSARY HOLDS
    ===================================================== */

    if (
        p >= .88 &&
        p < .92
    ) {

        name.style.opacity = 0;

        message.style.opacity = 1;

        message.style.transform =

            "translate(-50%, -50%) scale(1)";


        message.innerHTML =

            "You're the ONE;<br>" +
            "Happy Work-Anniversary!";


        message.classList.remove(
            "glitch"
        );


        credit.style.opacity = 0;
    }



    /* =====================================================
       92% → 94%
       ANNIVERSARY FADES
    ===================================================== */

    if (
        p >= .92 &&
        p < .94
    ) {

        const fade =

            1 -
            (
                (p - .92) /
                .02
            );


        name.style.opacity = 0;

        message.style.opacity =
            Math.max(
                0,
                fade
            );

        credit.style.opacity = 0;
    }



    /* =====================================================
       94% → 100%
       FINAL CREDIT DECODES
    ===================================================== */

    if (
        p >= .94
    ) {

        name.style.opacity = 0;

        message.style.opacity = 0;


        /*
            FINAL CREDIT
            gets a full 6% of
            the scroll distance.
        */

        const progress =

            (p - .94) /
            .06;


        credit.style.opacity = 1;


        /*
            Start smaller and
            grow into place.
        */

        const scale =

            .75 +
            progress * .25;


        credit.style.transform =

            `translate(-50%, -50%)
             scale(${scale})`;


        /*
            MATRIX DECODING
        */

        credit.textContent =

            scrambleText(

                "In Courtesy of Land/FX",

                progress
            );


        /*
            Glitch while decoding.
        */

        if (
            progress < 1
        ) {

            credit.classList.add(
                "glitch"
            );

        }

        else {

            credit.classList.remove(
                "glitch"
            );


            credit.textContent =
                "In Courtesy of Land/FX";
        }
    }



    /* =====================================================
       INSTRUCTION
    ===================================================== */

    if (
        p < .08
    ) {

        instruction.style.opacity = 1;

    }

    else {

        instruction.style.opacity = 0;
    }



    /* =====================================================
       FINAL FLASH
    ===================================================== */

    if (
        p > .985
    ) {

        const flashAmount =

            (p - .985) * 6;


        flash.style.opacity =

            Math.min(
                .06,
                flashAmount
            );

    }

    else {

        flash.style.opacity = 0;
    }

}



/* =========================================================
   INITIAL STATE
========================================================= */

updateScroll();

</script>

</body>

</html>
