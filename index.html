#matrix {
    position: fixed;

    inset: 0;

    width: 100%;

    z-index: 1;

    background: #000;
}

   DARK OVERLAY
========================================================= */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(0,255,65,.06),
            rgba(0,0,0,.72)
        );
}
