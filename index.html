<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ALEX — The ONE</title>


<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #000;
}

body {

    background: #000;

    color: #00ff41;

    font-family:
        "Courier New",
        monospace;

    /*
        Tall page gives us scrolling space.
    */

    height: 1000vh;

    overflow-x: hidden;
}


/* =========================================================
   MATRIX CANVAS
========================================================= */

#matrix {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;

    background: #000;
}


/* =========================================================
   DARK OVERLAY
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:

        radial-gradient(
            circle at center,

            rgba(0,255,65,.06),

            rgba(0,0,0,.72)
        );
}


/* =========================================================
   ALEX
========================================================= */

#name {

    position: fixed;

    z-index: 5;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.75);

    width: 100%;

    text-align: center;

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(
            70px,
            17vw,
            250px
        );

    font-weight: bold;

    letter-spacing: .10em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 35px #00ff41,

        0 0 70px rgba(0,255,65,.7);

    opacity: 0;

    white-space: nowrap;

    transition:

        opacity .12s linear,

        transform .12s linear;
}


/* =========================================================
   ANNIVERSARY MESSAGE
========================================================= */

#message {

    position: fixed;

    z-index: 6;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.90);

    width: 90%;

    text-align: center;

    font-family:
        "Courier New",
        monospace;

    /*
        Responsive size.
    */

    font-size:
        clamp(
            24px,
            4.5vw,
            72px
        );

    font-weight: bold;

    line-height: 1.35;

    letter-spacing: .04em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 30px #00ff41,

        0 0 60px rgba(0,255,65,.7);

    opacity: 0;

    white-space: normal;

    pointer-events: none;

    transition:

        opacity .15s linear,

        transform .15s linear;
}


/* =========================================================
   GLITCH EFFECT
========================================================= */

.glitch {

    animation:
        glitch .12s infinite;
}


@keyframes glitch {

    0% {

        transform:
            translate(-50%, -50%)
            translate(0,0)
            scale(1);
    }

    20% {

        transform:
            translate(-50%, -50%)
            translate(-4px,2px)
            scale(1.01);
    }

    40% {

        transform:
            translate(-50%, -50%)
            translate(4px,-2px)
            scale(.99);
    }

    60% {

        transform:
            translate(-50%, -50%)
            translate(-2px,-1px)
            scale(1.01);
    }

    80% {

        transform:
            translate(-50%, -50%)
            translate(3px,2px)
            scale(.99);
    }

    100% {

        transform:
            translate(-50%, -50%)
            translate(0,0)
            scale(1);
    }
}


/* =========================================================
   SCROLL INSTRUCTION
========================================================= */

#instruction {

    position: fixed;

    z-index: 7;

    left: 50%;

    bottom: 8%;

    transform:
        translateX(-50%);

    color:
        rgba(0,255,65,.85);

    font-size: 14px;

    letter-spacing: 4px;

    text-align: center;

    text-shadow:
        0 0 10px #00ff41;

    transition:
        opacity .5s ease;

    white-space: nowrap;
}


/* =========================================================
   SCANLINES
========================================================= */

.scanlines {

    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    background:

        repeating-linear-gradient(

            to bottom,

            rgba(255,255,255,.025)
            0px,

            rgba(255,255,255,.025)
            1px,

            transparent
            2px,

            transparent
            4px
        );

    mix-blend-mode: screen;
}


/* =========================================================
   SCREEN GLOW
========================================================= */

.screenGlow {

    position: fixed;

    inset: 0;

    z-index: 9;

    pointer-events: none;

    box-shadow:

        inset
        0 0 100px
        rgba(0,255,65,.12);
}


/* =========================================================
   BOTTOM FLASH
========================================================= */

#flash {

    position: fixed;

    inset: 0;

    z-index: 8;

    background: #00ff41;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .1s linear;
}

</style>

</head>


<body>


<!-- =====================================================
     MATRIX BACKGROUND
===================================================== -->

<canvas id="matrix"></canvas>


<div class="overlay"></div>


<!-- =====================================================
     ALEX
===================================================== -->

<div id="name">
    ALEX
</div>


<!-- =====================================================
     FINAL MESSAGE
===================================================== -->

<div id="message">
    You're the ONE;<br>
    Happy Work-Anniversary!
</div>


<!-- =====================================================
     INSTRUCTION
===================================================== -->

<div id="instruction">
    SCROLL TO DECODE
</div>


<!-- =====================================================
     EFFECTS
===================================================== -->

<div id="flash"></div>

<div class="scanlines"></div>

<div class="screenGlow"></div>



<script>

/* =========================================================
   MATRIX ENGINE
========================================================= */

const canvas =
    document.getElementById("matrix");

const ctx =
    canvas.getContext("2d");


let width;
let height;

let fontSize = 18;

let columns;

let drops = [];


/*
    Matrix character set
*/

const matrixCharacters =

"アァカサタナハマヤラワ0123456789" +

"ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

"#$%&*@";


/* =========================================================
   RESIZE CANVAS
========================================================= */

function resizeCanvas() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;


    columns =
        Math.floor(
            width / fontSize
        );


    drops = [];


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        drops[i] =
            Math.random() * -50;
    }
}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   MATRIX RAIN
========================================================= */

function drawMatrix() {


    /*
        Transparent black creates
        the trailing effect.
    */

    ctx.fillStyle =
        "rgba(0,0,0,0.075)";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.font =
        fontSize +
        "px Courier New";


    for (
        let i = 0;
        i < drops.length;
        i++
    ) {


        const character =

            matrixCharacters[
                Math.floor(
                    Math.random() *
                    matrixCharacters.length
                )
            ];


        /*
            Random brightness
        */

        const brightness =
            Math.random();


        if (
            brightness > .94
        ) {

            ctx.fillStyle =
                "#ffffff";

        }

        else if (
            brightness > .75
        ) {

            ctx.fillStyle =
                "#66ff88";

        }

        else {

            ctx.fillStyle =
                "#00ff41";
        }


        ctx.fillText(

            character,

            i * fontSize,

            drops[i] *
            fontSize
        );


        /*
            Restart streams
        */

        if (

            drops[i] *
            fontSize >
            height

            &&

            Math.random() > .975

        ) {

            drops[i] = 0;
        }


        drops[i] += .45;
    }


    requestAnimationFrame(
        drawMatrix
    );
}


drawMatrix();



/* =========================================================
   ELEMENTS
========================================================= */

const name =
    document.getElementById("name");

const message =
    document.getElementById("message");

const instruction =
    document.getElementById(
        "instruction"
    );

const flash =
    document.getElementById("flash");



/* =========================================================
   SCRAMBLE CHARACTERS
========================================================= */

const glitchCharacters =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

"0123456789" +

"@#$%&*<>[]{}" +

"アカサタナハマヤラ";


/* =========================================================
   GENERATE SCRAMBLED TEXT
========================================================= */

function scrambleText(
    target,
    progress
) {

    let output = "";


    for (
        let i = 0;
        i < target.length;
        i++
    ) {


        /*
            Spaces remain spaces.
        */

        if (
            target[i] === " "
            ||
            target[i] === "\n"
            ||
            target[i] === "-"
            ||
            target[i] === ";"
        ) {

            output +=
                target[i];

            continue;
        }


        /*
            Each character gets
            its own decoding point.
        */

        const characterProgress =

            progress *
            target.length
            -
            i;


        if (
            characterProgress >= 1
        ) {

            output +=
                target[i];

        }

        else {

            output +=

                glitchCharacters[
                    Math.floor(
                        Math.random() *
                        glitchCharacters.length
                    )
                ];
        }
    }


    return output;
}



/* =========================================================
   SCROLL
========================================================= */

window.addEventListener(
    "scroll",
    updateScroll
);


function updateScroll() {


    /*
        Calculate total scroll.
    */

    const maxScroll =

        document.documentElement
        .scrollHeight
        -
        window.innerHeight;


    let scrollProgress =

        window.scrollY /
        maxScroll;


    /*
        Keep between 0 and 1.
    */

    scrollProgress =

        Math.max(
            0,
            Math.min(
                1,
                scrollProgress
            )
        );



    /* =====================================================
       ALEX SECTION
    ===================================================== */

    /*
        ALEX begins appearing
        around 10% scroll.
    */

    const alexProgress =

        Math.max(
            0,
            Math.min(
                1,
                (scrollProgress - .08) /
                .30
            )
        );


    /*
        Fade ALEX in.
    */

    name.style.opacity =
        alexProgress;


    /*
        Scale ALEX.
    */

    const alexScale =

        .75 +
        alexProgress * .25;


    name.style.transform =

        `translate(-50%, -50%)
         scale(${alexScale})`;


    /*
        Scramble ALEX.
    */

    name.textContent =

        scrambleText(
            "ALEX",
            alexProgress
        );


    /*
        Glitch while decoding.
    */

    if (

        alexProgress > 0 &&
        alexProgress < 1

    ) {

        name.classList.add(
            "glitch"
        );

    }

    else {

        name.classList.remove(
            "glitch"
        );
    }



    /* =====================================================
       FINAL MESSAGE
    ===================================================== */

    /*
        The final message begins
        appearing during the last
        ~25% of the page.
    */

    const messageProgress =

        Math.max(
            0,
            Math.min(
                1,
                (scrollProgress - .72) /
                .24
            )
        );


    /*
        Fade final message in.
    */

    message.style.opacity =
        messageProgress;


    /*
        Scale final message.
    */

    const messageScale =

        .90 +
        messageProgress * .10;


    message.style.transform =

        `translate(-50%, -50%)
         scale(${messageScale})`;


    /*
        Decode message.
    */

    message.innerHTML =

        scrambleTextHTML(
            "You're the ONE;\nHappy Work-Anniversary!",
            messageProgress
        );


    /*
        Glitch effect.
    */

    if (

        messageProgress > 0 &&
        messageProgress < 1

    ) {

        message.classList.add(
            "glitch"
        );

    }

    else {

        message.classList.remove(
            "glitch"
        );
    }



    /* =====================================================
       ALEX FADES AWAY
    ===================================================== */

    if (
        scrollProgress > .65
    ) {

        const fadeOut =

            Math.max(
                0,
                1 -
                (scrollProgress - .65) /
                .12
            );


        name.style.opacity =
            fadeOut;
    }



    /* =====================================================
       INSTRUCTION
    ===================================================== */

    if (
        scrollProgress < .08
    ) {

        instruction.style.opacity =
            1;

    }

    else {

        instruction.style.opacity =

            Math.max(
                0,
                1 -
                scrollProgress * 4
            );
    }



    /* =====================================================
       FINAL FLASH
    ===================================================== */

    /*
        Tiny flash when reaching
        the very bottom.
    */

    if (
        scrollProgress > .98
    ) {

        const flashAmount =

            (scrollProgress - .98)
            * 10;


        flash.style.opacity =

            Math.min(
                .08,
                flashAmount
            );

    }

    else {

        flash.style.opacity = 0;
    }

}



/* =========================================================
   HTML VERSION OF SCRAMBLE
========================================================= */

function scrambleTextHTML(
    target,
    progress
) {

    let output = "";


    for (
        let i = 0;
        i < target.length;
        i++
    ) {


        const character =
            target[i];


        /*
            Preserve line breaks.
        */

        if (
            character === "\n"
        ) {

            output +=
                "<br>";

            continue;
        }


        /*
            Preserve spaces.
        */

        if (
            character === " "
        ) {

            output +=
                "&nbsp;";

            continue;
        }


        /*
            Preserve punctuation.
        */

        if (
            character === "-" ||
            character === "!" ||
            character === ";"
        ) {

            output +=
                character;

            continue;
        }


        /*
            Decode character
            progressively.
        */

        const characterProgress =

            progress *
            target.length
            -
            i;


        if (
            characterProgress >= 1
        ) {

            output +=
                character;

        }

        else {

            output +=

                glitchCharacters[
                    Math.floor(
                        Math.random() *
                        glitchCharacters.length
                    )
                ];
        }
    }


    return output;
}



/* =========================================================
   INITIAL STATE
========================================================= */

updateScroll();

</script>

</body>

</html>
