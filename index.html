<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ALEX — The ONE</title>


<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #000;
}

body {

    background: #000;

    color: #00ff41;

    font-family:
        "Courier New",
        monospace;

    /*
        CHANGE THIS NUMBER TO MAKE
        THE PAGE LONGER OR SHORTER.
    */

    height: 1100vh;

    overflow-x: hidden;
}


/* =========================================================
   MATRIX
========================================================= */

#matrix {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;

    background: #000;
}


/* =========================================================
   DARK OVERLAY
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:

        radial-gradient(
            circle at center,

            rgba(0,255,65,.06),

            rgba(0,0,0,.72)
        );
}


/* =========================================================
   ALEX
========================================================= */

#name {

    position: fixed;

    z-index: 5;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.75);

    width: 100%;

    text-align: center;

    font-size:
        clamp(
            70px,
            17vw,
            250px
        );

    font-weight: bold;

    letter-spacing: .10em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 35px #00ff41,

        0 0 70px rgba(0,255,65,.7);

    opacity: 0;

    white-space: nowrap;
}


/* =========================================================
   ANNIVERSARY MESSAGE
========================================================= */

#message {

    position: fixed;

    z-index: 6;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.90);

    width: 90%;

    text-align: center;

    font-size:
        clamp(
            24px,
            4.5vw,
            72px
        );

    font-weight: bold;

    line-height: 1.35;

    letter-spacing: .04em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 30px #00ff41,

        0 0 60px rgba(0,255,65,.7);

    opacity: 0;

    pointer-events: none;
}


/* =========================================================
   FINAL CREDIT
========================================================= */

#credit {

    position: fixed;

    z-index: 7;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.75);

    width: 95%;

    text-align: center;

    font-size:
        clamp(
            75px,
            3.2vw,
            75px
        );

    font-weight: bold;

    line-height: 1.4;

    letter-spacing: .08em;

    color: #00ff41;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 30px #00ff41,

        0 0 60px rgba(0,255,65,.7);

    opacity: 0;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   GLITCH
========================================================= */

.glitch {

    animation:
        glitch .12s infinite;
}


@keyframes glitch {

    0% {
        filter: brightness(1);
    }

    25% {
        filter: brightness(1.7);
    }

    50% {
        filter: brightness(.75);
    }

    75% {
        filter: brightness(1.5);
    }

    100% {
        filter: brightness(1);
    }
}


/* =========================================================
   SCROLL INSTRUCTION
========================================================= */

#instruction {

    position: fixed;

    z-index: 7;

    left: 50%;

    bottom: 8%;

    transform:
        translateX(-50%);

    color:
        rgba(0,255,65,.85);

    font-size: 14px;

    letter-spacing: 4px;

    text-align: center;

    text-shadow:
        0 0 10px #00ff41;

    transition:
        opacity .5s ease;

    white-space: nowrap;
}


/* =========================================================
   SCANLINES
========================================================= */

.scanlines {

    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    background:

        repeating-linear-gradient(

            to bottom,

            rgba(255,255,255,.025)
            0px,

            rgba(255,255,255,.025)
            1px,

            transparent
            2px,

            transparent
            4px
        );

    mix-blend-mode: screen;
}


/* =========================================================
   SCREEN GLOW
========================================================= */

.screenGlow {

    position: fixed;

    inset: 0;

    z-index: 9;

    pointer-events: none;

    box-shadow:

        inset
        0 0 100px
        rgba(0,255,65,.12);
}


/* =========================================================
   FLASH
========================================================= */

#flash {

    position: fixed;

    inset: 0;

    z-index: 11;

    background: #00ff41;

    opacity: 0;

    pointer-events: none;
}

</style>

</head>


<body>


<!-- =====================================================
     MATRIX BACKGROUND
===================================================== -->

<canvas id="matrix"></canvas>

<div class="overlay"></div>


<!-- =====================================================
     ALEX
===================================================== -->

<div id="name">
    ALEX
</div>


<!-- =====================================================
     ANNIVERSARY MESSAGE
===================================================== -->

<div id="message">
    You're the ONE;<br>
    Happy Work-Anniversary!
</div>


<!-- =====================================================
     FINAL CREDIT
===================================================== -->

<div id="credit">
    In Courtesy of Land/FX
</div>


<!-- =====================================================
     INSTRUCTION
===================================================== -->

<div id="instruction">
    SCROLL TO DECODE
</div>


<!-- =====================================================
     EFFECTS
===================================================== -->

<div id="flash"></div>

<div class="scanlines"></div>
